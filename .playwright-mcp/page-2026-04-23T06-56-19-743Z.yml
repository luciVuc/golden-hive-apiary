          - generic [ref=e49]:
            - paragraph [ref=e50]: CS Regus Apiary was founded in 2009 when beekeeper Sarah Mitchell received her first two hives as a wedding gift. What started as a quiet hobby in the meadows of rural California has grown into a beloved local business dedicated to sustainable beekeeping and exceptional honey.
            - paragraph [ref=e51]: Our bees forage among the pristine wildflowers of the Green Mountain State, away from pesticides and industrial agriculture. We believe in letting nature do its work — our honey is never heated, filtered, or processed. It goes from hive to jar just as the bees made it.
            - paragraph [ref=e52]: "Every drop of CS Regus Apiary honey carries the flavors of California: clover, wildflower, buckwheat, and apple blossom. We're proud to share this liquid gold with families across the Bay Area and beyond."
